[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", 
           "php83Extensions.mbstring", "php83Extensions.xml", 
           "php83Extensions.gd", "php83Extensions.zip", 
           "nodejs_20", "npm"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", 
        "npm ci", "npm run build"]

[phases.build]
cmds = ["php artisan config:clear"]

[start]
cmd = "php artisan migrate --force && php artisan storage:link || true && php artisan optimize && php -S 0.0.0.0:$PORT -t public"