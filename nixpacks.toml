[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.xml",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Extensions.curl",
    "php83Extensions.tokenizer",
    "php83Extensions.bcmath",
    "nodejs_20",
    "npm"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
    "npm run build"
]

[phases.build]
cmds = [
    "php artisan config:clear",
    "php artisan view:clear"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan storage:link || true && php artisan optimize && php -S 0.0.0.0:$PORT -t public"